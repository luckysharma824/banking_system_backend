server.servlet.context-path=/api/banking

spring.application.name=bankingProject
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db
spring.datasource.username=username
spring.datasource.password=password
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Logging configuration (handled by logback-spring.xml)
# Set active profile: dev, test, or prod
spring.profiles.active=dev

# Log file location (optional, already defined in logback-spring.xml)
logging.file.path=logs
logging.file.name=logs/bankingProject.log

# Pattern for console output (optional, can override logback config)
# logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# Charset
logging.charset.console=UTF-8
logging.charset.file=UTF-8